repos:
  - repo: https://github.com/secondlife/git-hooks.git
    rev: v1.0.2
    hooks:
      - id: opensource-license
      - id: llsd
      - id: no-trigraphs
      - id: copyright
      - id: end-of-file
        files: \.(cpp|c|m|mm|h|py|glsl|cmake|txt)$
        exclude: language.txt
      - id: indent-with-spaces
        files: \.(cpp|c|m|mm|h|inl|py|glsl|cmake)$
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-xml
      - id: mixed-line-ending
      - id: trailing-whitespace
        files: \.(cpp|c|m|mm|h|inl|py|glsl|cmake|yaml|sh)$
  - repo: local
    hooks:
      - id: render-api-boundary
        name: prevent renderer API coupling growth
        entry: python scripts/code_tools/check_render_api_boundary.py --check
        language: system
        pass_filenames: false
        files: ^indra/(llappearance|llrender|llui|llwindow|newview)/.*\.(c|cc|cpp|h|hpp|inl|m|mm)$
