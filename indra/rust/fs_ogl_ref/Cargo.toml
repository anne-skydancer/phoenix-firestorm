# fs_ogl_ref -- the reference ORACLE for the apples-to-apples OGL<->VLK verify harness.
# A headless wgpu engine that faithfully REPRODUCES the SL OpenGL pipeline (the real OGL shaders +
# real pass structure, from RENDER_STRATIGRAPHY.md), diffed pixel-for-pixel against fs_render.
# See indra/rust/fs_render/REFERENCE_HARNESS_PLAN.md.
[package]
name = "fs_ogl_ref"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["rlib"]

[dependencies]
png = "0.17"
wgpu = { version = "0.19", features = ["spirv"] } # spirv: run the real OGL shaders (GLSL->SPIR-V) later
pollster = "0.3"
bytemuck = { version = "1", features = ["derive"] }
log = "0.4"

[profile.release]
opt-level = 3
lto = "thin"
