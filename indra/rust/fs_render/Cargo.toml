# fs_render -- the live-bridge renderer (rhi/PLAN.md Phase 3, PHASE3_PLAN.md P3a).
# cdylib by REQUIREMENT: a second Rust staticlib cannot co-link beside llrust
# (duplicate libstd lang items); the viewer LoadLibrary()s this at runtime in
# engine mode only. Standalone wgpu stack; shares no build artifacts with llrust.
[package]
name = "fs_render"
version = "0.1.0"
edition = "2021"

[lib]
# cdylib: the viewer LoadLibrary()s this at runtime. rlib: lets the in-repo headless
# harness (tests/) drive the real LiveRenderer offscreen for deterministic verification.
crate-type = ["cdylib", "rlib"]

[dependencies]
png = "0.17"
wgpu = { version = "0.19", features = ["spirv"] }
pollster = "0.3"
bytemuck = { version = "1", features = ["derive"] }
glam = "0.27"
raw-window-handle = "0.6"
log = "0.4"
env_logger = "0.11"

# P3 engine-hosted J2C decode: the SHARED decoder crate (single source, also used by the viewer's
# llrust). It bindgens the Grok C-API; fs_render's build.rs links grokj2k (import lib at
# C:/fs/grok/build/bin; grokj2k.dll ships in newview/Release).
j2c = { path = "../../../../firestorm-upstream/indra/rust/j2c", features = ["grok"] }

[profile.release]
opt-level = 3
lto = "thin"
