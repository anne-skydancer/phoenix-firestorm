# cbindgen config -> generates a C header (llrust_j2c.h) from the crate's
# `extern "C"` surface so the C++ llimagej2crust backend can call it. Run by the
# cmake integration at build time. Mirrors indra/rust/llrust/cbindgen.toml.
language = "C"
cpp_compat = true
include_guard = "LLRUST_J2C_H"
pragma_once = true
autogen_warning = "/* GENERATED by cbindgen from indra/rust/llrust-j2c. Do not edit by hand. */"
tab_width = 4
style = "type"

[export]
prefix = ""

[parse]
parse_deps = false
