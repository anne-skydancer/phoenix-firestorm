[package]
name = "llrust"
version = "0.1.0"
edition = "2021"
description = "Rust components linked into the Firestorm viewer via a C ABI. First target: SL mesh asset decode (untrusted zlib + quantized vertex data)."
license = "LGPL-2.1"
publish = false

[lib]
name = "llrust"
# staticlib -> a single libllrust.a the C++ viewer links directly.
crate-type = ["staticlib"]

[dependencies]
# zlib inflate for mesh LOD blocks. Pure-Rust miniz_oxide backend -> no C dep,
# nothing new to link on FreeBSD.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }

[features]
# J2C decode over the Grok codec. Enabled by LLRust.cmake only for USE_GROK builds
# (grokj2k is linked into the viewer via llimagej2cgrok, which resolves grk_*).
# Phase 1a: just declares/calls grk_version(). Phase 1b adds the hand-written decode
# struct FFI + the real decode. Keeps the default (feature-less) build lean.
grok = []

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
# Never unwind a Rust panic across the C ABI into C++ -- abort instead.
panic = "abort"
