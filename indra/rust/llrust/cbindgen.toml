# cbindgen config -> generates a C header (llrust.h) from the crate's
# `extern "C"` surface so C++ can call it. Run by LLRust.cmake at build time.
language = "C"
# Wrap declarations in `extern "C"` when the header is compiled as C++ so the
# viewer links against Rust's unmangled C symbols (not C++-mangled names).
cpp_compat = true
include_guard = "LLRUST_H"
pragma_once = true
autogen_warning = "/* GENERATED by cbindgen from indra/rust/llrust. Do not edit by hand. */"
tab_width = 4
style = "type"

[export]
prefix = ""

[parse]
parse_deps = false
